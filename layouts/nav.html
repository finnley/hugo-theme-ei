
{{ define "main" }}
<div class="fullscreen-container">
    <aside class="left-panel">
        {{ if .Params.menu_items }}
        {{ partial "nav_left.html" (dict "title" .Params.menu_title "items" .Params.menu_items) }}
        {{ end }}
    </aside>

    <div class="right-panel">
        {{ range .Params.right_sections }}
        {{ partial "nav_right.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
